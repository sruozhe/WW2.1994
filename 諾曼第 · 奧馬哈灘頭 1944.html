canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000}
#hud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}

#stat{top:18px;left:18px;font-size:14px;line-height:1.7}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;opacity:.7;box-sizing:border-box}
#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:20px;opacity:0;transition:opacity .4s;background:var(--panel);padding:6px 18px;border-radius:4px;white-space:nowrap}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:18px}
#hit{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px var(--accent);opacity:0;transition:opacity .25s}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(14,15,10,.88);text-align:center;gap:8px;padding:20px;overflow:auto}
#ov h1{margin:0;font-size:38px;letter-spacing:3px}
#ov p{margin:0;opacity:.88;line-height:1.8;font-size:14px}
#ov button{margin-top:8px;font-size:20px;padding:12px 36px;border:0;border-radius:4px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.card{width:200px;text-align:left;padding:10px 12px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:6px;cursor:pointer}
.card.on{border-color:var(--accent);background:rgba(184,69,46,.2)}
.card h3{margin:0 0 4px;font-size:15px}
#cards .card p{margin:0 0 6px;font-size:12px;opacity:.8;line-height:1.5}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0}.bar span{width:28px}
.bar em{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}.bar s{display:block;height:100%;background:var(--accent)}
</style>
</head>

<canvas id="c"></canvas>
<div id="hud"><div id="hit"></div><div id="cross"></div><div id="score"></div><div id="stat"></div><div id="msg"></div><div id="prompt"></div><div id="hp"></div><div id="ammo"></div></div>
<div id="ov"><h1>諾曼第 · 灘頭 1944</h1>
<p>WASD 移動　空白鍵 跳躍　滑鼠瞄準　左鍵射擊　R 換彈　Shift 衝刺　<b>G</b> 手榴彈　<b>Q</b> 呼叫迫擊砲（瞄準地面）<br>
<b>E</b> 操作掩體機槍／登上戰車（W/S 前後、A/D 轉向、滑鼠轉砲塔、左鍵開砲）　<b>Tab</b> 武器面板<br><b>C</b> 點菸回血（地上的香菸盒一包 20 根，會重新刷新；叼著菸可以照常射擊與行動）<br>
懸崖高地上有敵軍機槍巢與狙擊手：用戰車主砲、迫擊砲或手榴彈拔掉它們。戰車會不定時運抵灘頭。</p>
<div id="cards"></div><p id="final"></p><button id="go">登陸灘頭</button></div>

 if(tank&&Math.hypot(P.x-tank.x,P.z-tank.z)<5.5){inTank=true;P.y=0;P.vy=0;P.yaw=tank.yaw;P.pitch=0;msg('W/S 前後　A/D 轉向　滑鼠轉砲塔　左鍵開砲　E 下車');return}
 const m=nearMG();if(m){inMG=m;P.x=m.x;P.z=m.z+.95;P.yaw=0;P.pitch=0;msg('機槍就位：左鍵連射　E 離開')}}
// ---- 輸入 / 介面 ----
addEventListener('keydown',e=>{keys[e.code]=true;
 if(running&&(e.code==='Tab'||e.code==='KeyB')){e.preventDefault();setPause(!paused)}
 if(running&&!paused){if(e.code==='KeyG')throwG();if(e.code==='KeyQ')callMortar();if(e.code==='KeyE')interact();if(e.code==='KeyC')lightUp();
  if(e.code==='KeyR'&&!inTank&&!inMG&&P.reload<=0&&W[cur].ammo<W[cur].mag)P.reload=W[cur].rel;
  if(e.code>='Digit1'&&e.code<='Digit3'&&!inTank&&!inMG)equip(+e.code.slice(5)-1)}});
addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(!locked&&running&&!paused)setPause(true)});
$('cards').onclick=e=>{const c=e.target.closest('.card');if(!c)return;sel=+c.dataset.i;if(running)equip(sel);buildCards()};
cv.addEventListener('mousedown',()=>{if(!running||paused)return;firing=true;drag=!locked;if(!locked)try{cv.requestPointerLock()}catch(e){}
 if(inTank)fireCannon();else if(!inMG&&!W[cur].auto)shoot()});
addEventListener('mouseup',()=>{firing=false;drag=false});
addEventListener('mousemove',e=>{if(!running||paused||!(locked||drag))return;P.yaw-=e.movementX*.0025;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*.0025))});
const INFO=[{d:'美軍標準步槍。半自動，8 發彈夾，穩定精準。',p:55,r:45,m:35},{d:'芝加哥打字機。全自動火力壓制，近距離最強。',p:30,r:95,m:85},{d:'德軍栓動步槍。射速慢，但一槍就能放倒步兵。',p:90,r:15,m:20}];
function buildCards(){$('cards').innerHTML=W.map((w,i)=>'<div class="card'+(i===sel?' on':'')+'" data-i="'+i+'"><h3>'+(i+1)+' · '+w.n+'</h3><p>'+INFO[i].d+'</p>'+
 [['威力','p'],['射速','r'],['彈容','m']].map(b=>'<div class="bar"><span>'+b[0]+'</span><em><s style="width:'+INFO[i][b[1]]+'%"></s></em></div>').join('')+'</div>').join('')}
function setPause(p){paused=p;if(p){if(document.exitPointerLock)document.exitPointerLock();$('ov').style.display='flex';document.querySelector('#ov h1').textContent='選擇武器';$('final').textContent='';$('go').textContent='繼續戰鬥';buildCards()}
 else{$('ov').style.display='none';try{cv.requestPointerLock()}catch(e){}}}
function over(){paused=false;buildCards();running=false;firing=false;if(document.exitPointerLock)document.exitPointerLock();
 $('ov').style.display='flex';document.querySelector('#ov h1').textContent='陣亡';$('final').textContent='堅守到第 '+wave+' 波，得分 '+score;$('go').textContent='重返灘頭'}
function startWave(){wave++;const n=Math.min(14,3+wave*2);for(let i=0;i<n;i++)spawnInf();
 for(let i=0;i<Math.min(4,1+Math.ceil(wave/2));i++)if(!nestE[i])spawnNest(i);for(let i=0;i<Math.min(3,Math.floor((wave+1)/2));i++)if(!snE[i])spawnSn(i);
 W.forEach(w=>w.ammo=w.mag);gren=4;P.hp=Math.min(100,P.hp+25);msg('第 '+wave+' 波：敵軍來襲！')}
$('go').onclick=()=>{
 if(paused){equip(sel);setPause(false);return}
 enemies.slice().forEach(killEnemy);if(tank){S.remove(tank.g);tank=null}
 mq.length=0;Object.assign(P,{x:0,z:68,y:0,vy:0,yaw:0,pitch:0,hp:100,reload:0,cd:0});inTank=false;inMG=null;mgs.forEach(m=>{m.belt=200;m.rel=0});
 wave=0;score=0;gren=4;mcd=0;emt=20;tankT=10;cigs=2;smokeT=0;packs.forEach(p=>{p.on=true;p.g.visible=true});running=true;nextWave=0;$('ov').style.display='none';equip(sel);startWave();try{cv.requestPointerLock()}catch(e){}};
// ---- 主迴圈 ----
const clk=new THREE.Clock(),tmp=new THREE.Vector3();
function loop(){
 requestAnimationFrame(loop);
 const dt=paused?(clk.getDelta(),0):Math.min(clk.getDelta(),.05);tt+=dt;
 if(running){
  const w=W[cur];
  if(inTank){
   const fw=(keys.KeyW?1:0)-(keys.KeyS?1:0),tr=(keys.KeyA?1:0)-(keys.KeyD?1:0);tank.yaw+=tr*1.1*dt*(fw<0?-1:1);
   const sp=fw*(fw>0?7:4)*dt,nx=tank.x-Math.sin(tank.yaw)*sp,nz=tank.z-Math.cos(tank.yaw)*sp;
   if(!blocked(nx,tank.z,2.2,0,true))tank.x=nx;if(!blocked(tank.x,nz,2.2,0,true))tank.z=nz;
   P.x=tank.x;P.z=tank.z;P.y=0;P.pitch=Math.max(-.15,Math.min(.45,P.pitch));
  }else if(inMG){
   P.yaw=Math.max(-1.1,Math.min(1.1,P.yaw));P.pitch=Math.max(-.35,Math.min(.55,P.pitch));inMG.g.rotation.set(P.pitch,P.yaw,0,'YXZ');
   inMG.cd-=dt;if(inMG.rel>0){inMG.rel-=dt;if(inMG.rel<=0)inMG.belt=200}if(firing)mgFire();
  }else{
   const sp=(keys.ShiftLeft?8.5:5)*dt;let fx2=(keys.KeyW?1:0)-(keys.KeyS?1:0),sx=(keys.KeyD?1:0)-(keys.KeyA?1:0);const l=Math.hypot(fx2,sx)||1;fx2/=l;sx/=l;
   const dx=(-Math.sin(P.yaw)*fx2+Math.cos(P.yaw)*sx)*sp,dz=(-Math.cos(P.yaw)*fx2-Math.sin(P.yaw)*sx)*sp;
   if(!blocked(P.x+dx,P.z,.4,P.y))P.x+=dx;if(!blocked(P.x,P.z+dz,.4,P.y))P.z+=dz;
   const g0=gnd(P.x,P.z);if(keys.Space&&P.y<=g0+.01)P.vy=7.5;P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=g0){P.y=g0;P.vy=0}
   P.cd-=dt;if(P.reload>0){P.reload-=dt;if(P.reload<=0)w.ammo=w.mag}
   if(firing&&w.auto)shoot();
   gun.position.z+=(-.5-gun.position.z)*Math.min(1,dt*18);if(P.cd<w.rate-.06)flash.visible=false;
  }
  if(tank){tank.cd=Math.max(0,tank.cd-dt);tank.barrel.position.z+=(0-tank.barrel.position.z)*Math.min(1,dt*6);
   tank.g.position.set(tank.x,0,tank.z);tank.g.rotation.y=tank.yaw;if(inTank){tank.tu.rotation.y=P.yaw-tank.yaw;tank.barrel.rotation.x=P.pitch}}
  if(!tank&&tankT>0){tankT-=dt;if(tankT<=0)spawnTank()}
  mcd=Math.max(0,mcd-dt);
  if(smokeT>0){smokeT-=dt;P.hp=Math.min(100,P.hp+2.2*dt);if(smokeT<=0){exhale(5);msg('菸抽完了')}}
  packs.forEach(p=>{if(p.on){if(Math.hypot(P.x-p.g.position.x,P.z-p.g.position.z)<1.8&&P.y<1.5){p.on=false;p.g.visible=false;p.t=35;cigs=Math.min(60,cigs+20);msg('拾取香菸 +20（按 C 點菸回血）');snd(2000,.08,.3)}}
   else{p.t-=dt;if(p.t<=0){let x,z,n=0;do{x=(rnd()-.5)*100;z=6+rnd()*58;n++}while(blocked(x,z,.6)&&n<30);p.g.position.set(x,0,z);p.on=true;p.g.visible=true;msg('新的香菸補給出現在灘頭')}}});
  // 敵軍迫擊砲
  if(wave>=2){emt-=dt;if(emt<=0){emt=16+rnd()*10;const q=new THREE.Vector3(P.x+(rnd()-.5)*10,0,P.z+(rnd()-.5)*10);mark(q,5.5,2.4,0xff3030);mq.push({t:2.4,pt:q,R:5.5,dmg:8});msg('⚠ 敵軍迫擊砲來襲！快移動！')}}
  for(let i=mq.length-1;i>=0;i--){mq[i].t-=dt;if(mq[i].t<=0){explode(mq[i].pt,mq[i].R,mq[i].dmg,true);mq.splice(i,1)}}
  // 手榴彈
  for(let i=gl.length-1;i>=0;i--){const q=gl[i],p=q.m.position;q.v.y-=20*dt;q.t-=dt;
   if(blocked(p.x+q.v.x*dt,p.z,.15,p.y))q.v.x*=-.4;else p.x+=q.v.x*dt;if(blocked(p.x,p.z+q.v.z*dt,.15,p.y))q.v.z*=-.4;else p.z+=q.v.z*dt;
   p.y+=q.v.y*dt;const gy=gnd(p.x,p.z)+.08;if(p.y<gy){p.y=gy;if(Math.abs(q.v.y)>1.5)q.v.y*=-.35;else q.v.y=0;q.v.x*=.75;q.v.z*=.75}
   if(q.t<=0){explode(p.clone(),6,9,true);S.remove(q.m);gl.splice(i,1)}}
  // 敵軍行動
  for(const e of enemies.slice()){
   const p=e.g.position,tx=inTank?tank.x:P.x,tz=inTank?tank.z:P.z,ex=tx-p.x,ez=tz-p.z,d=Math.hypot(ex,ez),ey=(P.y+1.4)-(p.y+1.5);
   e.g.rotation.y=Math.atan2(ex,ez);tmp.set(p.x,p.y+1.5,p.z);
   envRay.set(tmp.clone(),new THREE.Vector3(ex,ey,ez).normalize());envRay.far=Math.hypot(d,ey);
   const los=envRay.intersectObjects(env).length===0;
   if(e.type==='inf'){
    if((d>e.stop||!los)&&d>2.5){const mx=ex/d*e.sp*dt,mz=ez/d*e.sp*dt;
     if(!blocked(p.x+mx,p.z,.5))p.x+=mx;else p.z+=Math.sign(mz||1)*e.sp*dt*.8;if(!blocked(p.x,p.z+mz,.5))p.z+=mz;else p.x+=Math.sign(mx||1)*e.sp*dt*.8}
    else if(los){e.cd-=dt;if(e.cd<=0){e.cd=1+rnd()*.9;shotAt(e,tmp,.4,8)}}
   }else if(e.type==='mg'){
    if(los&&d<120){e.cd-=dt;if(e.burst>0){e.bt-=dt;if(e.bt<=0){e.bt=.11;e.burst--;shotAt(e,tmp,.3,3)}}else if(e.cd<=0){e.burst=5+((rnd()*5)|0);e.cd=2.2+rnd()*2}}
   }else{
    if(los&&d<150){e.cd-=dt;if(e.cd<=0&&e.aim<=0){e.aim=1;e.cd=4+rnd()*2}}
    if(e.aim>0){e.aim-=dt;e.glint.visible=(tt*14|0)%2===0;if(e.aim<=0){e.glint.visible=false;if(los)shotAt(e,tmp,.65,22)}}
   }}
  if(P.hp<=0)over();
  const inf=enemies.filter(e=>e.type==='inf').length;
  if(running&&inf===0&&nextWave<=0){nextWave=3;score+=200;msg('第 '+wave+' 波擊退！補給中…')}
  if(nextWave>0){nextWave-=dt;if(nextWave<=0&&running)startWave()}
 }
 // 特效更新
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t-=dt;q.v.y-=9*dt;q.m.position.addScaledVector(q.v,dt);if(q.t<=0){S.remove(q.m);parts.splice(i,1)}}
 for(let i=smk.length-1;i>=0;i--){const q=smk[i];q.t-=dt;q.m.position.addScaledVector(q.v,dt);const k=q.t/2.4;q.m.scale.setScalar(q.s*(1.2+(1-k)*2.6)*Math.min(1,k*3));if(q.t<=0){S.remove(q.m);smk.splice(i,1)}}
 for(let i=fx.length-1;i>=0;i--){const q=fx[i];q.t-=dt;const k=1-q.t/.45;q.m.scale.setScalar(.3+k*q.R*.55);q.m.material.opacity=Math.max(0,1-k);if(q.t<=0){S.remove(q.m);q.m.material.dispose();fx.splice(i,1)}}
 xl.intensity=Math.max(0,xl.intensity-dt*20);smokeFx(dt);
 for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.t-=dt;q.m.material.opacity=.4+.35*Math.sin(tt*10);if(q.t<=0){S.remove(q.m);rings.splice(i,1)}}
 for(const f of fires){f.l.intensity=1.8+rnd()*1.4;f.fl.forEach((m,i)=>m.scale.set(.8+rnd()*.4,.7+rnd()*.7,.8+rnd()*.4));f.t-=dt;if(f.t<=0){f.t=.3;smoke(new THREE.Vector3(f.x+(rnd()-.5),f.y+1,f.z+(rnd()-.5)),1.1)}}
 sea.material.map.offset.set(tt*.004,tt*.01);foam.forEach((m,i)=>{m.position.z=75.5+i*1.6+Math.sin(tt*.8+i*2)*1.6;m.material.opacity=.22+.14*Math.sin(tt*.8+i*2)});
 // 攝影機
 let cx=P.x,cy=1.6+P.y,cz=P.z;if(inTank){cx=tank.x+Math.sin(P.yaw)*.8;cz=tank.z+Math.cos(P.yaw)*.8;cy=3.1}else if(inMG)cy=1.5;
 shake*=Math.exp(-4*dt);const sh=(rnd()-.5)*shake*.35;cam.fov=inTank?65:75;cam.updateProjectionMatrix();
 cam.position.set(cx+sh,cy+sh,cz+sh);cam.rotation.set(P.pitch+sh*.3,P.yaw+sh*.3,0,'YXZ');
 gun.visible=!inTank&&!inMG;mlight.intensity=flash.visible?2.5:0;
 sun.position.set(cx+30,42,cz+18);sun.target.position.set(cx,0,cz);sky.position.set(cx,0,cz);
 // HUD
 const w=W[cur]||W[0],nm=enemies.filter(e=>e.type==='mg').length,ns=enemies.filter(e=>e.type==='sn').length,ni=enemies.filter(e=>e.type==='inf').length;
 $('hp').textContent=inTank?'戰車裝甲 '+Math.max(0,Math.ceil(tank.hp)):'生命 '+Math.max(0,Math.ceil(P.hp));
 $('ammo').innerHTML=inTank?'75mm 主砲<br>'+(tank.cd>0?'裝填中…':'就緒'):inMG?'M1919 機槍<br>'+(inMG.rel>0?'更換彈鏈…':inMG.belt+' 發'):w.n+'<br>'+(P.reload>0?'裝填中…':w.ammo+' / '+w.mag);
 $('score').textContent='第 '+wave+' 波　步兵 '+ni+'　機槍巢 '+nm+'　狙擊手 '+ns+'　得分 '+score;
 $('stat').innerHTML='手榴彈 '+gren+'（G）<br>迫擊砲 '+(mcd>0?Math.ceil(mcd)+' 秒':'就緒')+'（Q）<br>戰車 '+(tank?'已就位':tankT>0?'約 '+Math.ceil(tankT)+' 秒後抵達':'—')+'<br>香菸 '+cigs+' 根（C）'+(smokeT>0?' 抽菸中 '+Math.ceil(smokeT)+' 秒':'');
 $('prompt').textContent=(running&&!paused&&!inTank&&!inMG)?(tank&&Math.hypot(P.x-tank.x,P.z-tank.z)<5.5?'按 E 登上戰車':nearMG()?'按 E 操作機槍':''):'';
 R.render(S,cam);
}
buildCards();equip(0);loop();
</script>
</body>
